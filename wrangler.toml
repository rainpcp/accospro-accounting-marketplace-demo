# AccOS Pro worker — full-stack demo (free tier)
name = "accospro-accounting-marketplace-demo"
compatibility_date = "2025-08-01"
main = "src/index.ts"

# Static Assets: serve Vite build (frontend/dist) + API from same Worker
# Docs: https://developers.cloudflare.com/workers/static-assets/
[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
# ให้ /api/* เข้า Worker ก่อนเสมอ (กัน asset layer แย่ง/แคชผิด)
run_worker_first = ["/api/*"]

# D1 — free: 5GB storage, 5M rows read/day, 100k write/day
[[d1_databases]]
binding = "DB"
database_name = "accospro-marketplace-demo-db"
database_id = "3a895566-4cfe-45d0-82f7-84748d4a3802"

# R2 — free: 10GB (bucket accospro-marketplace-docs สร้างแล้ว)
[[r2_buckets]]
binding = "DOCS"
bucket_name = "accospro-marketplace-docs"

[observability]
enabled = true

# Google OAuth client id (public) — ใส่ค่าจริงแล้ว deploy ใหม่เพื่อเปิดปุ่ม Google
# ขอได้ที่ Google Cloud Console → APIs & Services → Credentials → OAuth client (Web)
[vars]
GOOGLE_CLIENT_ID = "206854028262-2fsirb2kqrd3m231a8httkp2qgblfvpq.apps.googleusercontent.com"
